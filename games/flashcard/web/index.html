<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wand Flashcards</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #211e30;
    --panel2: #2c2840;
    --accent: #c8823c;
    --accent2: #6a32c8;
    --text: #ece8f5;
    --muted: #9690ad;
    --danger: #c84646;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    padding: 16px 16px calc(16px + env(safe-area-inset-top));
    padding-top: calc(16px + env(safe-area-inset-top));
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    box-shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  .nav { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .nav .navrow { display: flex; gap: 10px; align-items: center; }
  .nav .navrow button { flex: 1; }
  .nav .navlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; width: 56px; flex: none; }
  .nav .count { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  button {
    font: inherit; font-weight: 600;
    color: var(--text); background: var(--panel2);
    border: none; border-radius: 10px;
    padding: 11px 14px; cursor: pointer;
    transition: filter .12s ease;
  }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); color: #1a1208; }
  button.ghost { background: transparent; border: 1px solid #443e5e; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid #5a2a2a; }
  button:disabled { opacity: .35; cursor: default; }

  .card-form {
    background: var(--panel); border-radius: 14px;
    padding: 14px; margin-bottom: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card-form label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  input[type=text] {
    font: inherit; color: var(--text);
    background: var(--panel2); border: 1px solid #3b3654;
    border-radius: 10px; padding: 11px 12px; width: 100%;
  }
  input[type=file] { font-size: 14px; color: var(--muted); }
  .preview { display: none; border-radius: 10px; max-height: 160px; object-fit: contain; background:#000; }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  li {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border-radius: 14px; padding: 12px;
    border: 2px solid transparent;
  }
  li.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cardhead { display: flex; align-items: flex-start; gap: 12px; }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; font-size: 16px; word-break: break-word; }
  .badge { display: inline-block; font-size: 11px; color: var(--accent); margin-top: 2px; }
  .actions { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .actions .row { display: flex; gap: 6px; }
  .actions button { padding: 8px 10px; font-size: 13px; }
  .reorder button { padding: 8px 11px; }

  /* Horizontal strip of a card's photos. */
  .photos { display: flex; gap: 8px; overflow-x: auto; padding: 2px; -webkit-overflow-scrolling: touch; }
  .photo { position: relative; flex: none; }
  .photo .thumb {
    width: 72px; height: 72px; display: block;
    border-radius: 10px; object-fit: cover; background: #000;
    border: 2px solid transparent; cursor: pointer;
  }
  .photo.active .thumb { border-color: var(--accent); }
  .photo .del {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; padding: 0; line-height: 1;
    border-radius: 50%; font-size: 13px; font-weight: 700;
    background: var(--danger); color: #fff; border: 2px solid var(--panel);
  }
  .addphoto {
    width: 72px; height: 72px; flex: none;
    border-radius: 10px; border: 2px dashed #443e5e;
    background: transparent; color: var(--muted);
    font-size: 26px; line-height: 1; cursor: pointer;
  }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🪄 Wand Flashcards</h1>
  <p>Upload cards, add photos, and choose what shows on screen.</p>
</header>

<main>
  <div class="nav">
    <div class="navrow">
      <span class="navlabel">Card</span>
      <button class="ghost" id="prevBtn">◀ Prev</button>
      <button class="ghost" id="nextBtn">Next ▶</button>
    </div>
    <div class="navrow">
      <span class="navlabel">Photo</span>
      <button class="ghost" id="prevPhotoBtn">◀</button>
      <span class="count" id="photoCount">– / –</span>
      <button class="ghost" id="nextPhotoBtn">▶</button>
    </div>
  </div>

  <form class="card-form" id="addForm">
    <label>New card image</label>
    <input type="file" id="imageInput" accept="image/*" required>
    <img class="preview" id="preview" alt="">
    <label>Name</label>
    <input type="text" id="nameInput" placeholder="e.g. APPLE" maxlength="40" required>
    <button class="primary" type="submit" id="addBtn">Add card</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No cards yet — add one above. ⬆️</div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let cards = [];
let currentId = "";
let currentPhoto = 0;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(method, path, body, isForm) {
  const opts = { method };
  if (isForm) opts.body = body;
  else if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(text || (method + " " + path + " failed"));
  }
  return res.status === 204 ? null : res.json();
}

async function refresh() {
  try {
    const data = await api("GET", "/api/cards");
    cards = data.cards;
    currentId = data.currentId;
    currentPhoto = data.currentPhoto;
    render();
  } catch (e) { /* keep last view on transient errors */ }
}

function currentCard() {
  return cards.find((c) => c.id === currentId);
}

function imgURL(cardId, photoId) {
  return "/api/cards/" + cardId + "/photos/" + photoId + "/image";
}

function render() {
  const list = $("list");
  $("empty").hidden = cards.length > 0;
  list.innerHTML = "";

  // Photo navigation reflects the current card's set.
  const cur = currentCard();
  const n = cur ? cur.photos.length : 0;
  $("photoCount").textContent = n > 0 ? (currentPhoto + 1) + " / " + n : "– / –";
  const single = n <= 1;
  $("prevPhotoBtn").disabled = single;
  $("nextPhotoBtn").disabled = single;

  cards.forEach((c, i) => {
    const li = document.createElement("li");
    if (c.isCurrent) li.classList.add("current");

    // Header: name + badge, then card-level actions.
    const head = document.createElement("div");
    head.className = "cardhead";

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = c.name;
    meta.appendChild(name);
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = (c.isCurrent ? "● ON SCREEN · " : "") +
      c.photos.length + (c.photos.length === 1 ? " photo" : " photos");
    meta.appendChild(badge);

    const actions = document.createElement("div");
    actions.className = "actions";
    const row1 = document.createElement("div");
    row1.className = "row";
    const showBtn = button(c.isCurrent ? "Showing" : "Show", "primary", () => setCurrent(c.id));
    showBtn.disabled = c.isCurrent;
    const renameBtn = button("Rename", "ghost", () => rename(c));
    row1.append(showBtn, renameBtn);
    const row2 = document.createElement("div");
    row2.className = "row reorder";
    const upBtn = button("▲", "ghost", () => move(c.id, i - 1));
    upBtn.disabled = i === 0;
    const downBtn = button("▼", "ghost", () => move(c.id, i + 1));
    downBtn.disabled = i === cards.length - 1;
    const delBtn = button("Delete", "danger", () => del(c));
    row2.append(upBtn, downBtn, delBtn);
    actions.append(row1, row2);

    head.append(meta, actions);

    // Photo strip: every photo, plus an add tile. Tapping a photo shows it.
    const strip = document.createElement("div");
    strip.className = "photos";
    c.photos.forEach((p, pi) => {
      const cell = document.createElement("div");
      cell.className = "photo";
      if (c.isCurrent && pi === currentPhoto) cell.classList.add("active");

      const img = document.createElement("img");
      img.className = "thumb";
      img.src = imgURL(c.id, p.id);
      img.alt = c.name;
      img.addEventListener("click", () => showPhoto(c.id, pi));
      cell.appendChild(img);

      if (c.photos.length > 1) {
        const x = document.createElement("button");
        x.className = "del";
        x.textContent = "×";
        x.title = "Remove photo";
        x.addEventListener("click", (e) => { e.stopPropagation(); delPhoto(c.id, p.id); });
        cell.appendChild(x);
      }
      strip.appendChild(cell);
    });
    const addTile = document.createElement("button");
    addTile.className = "addphoto";
    addTile.textContent = "＋";
    addTile.title = "Add photo";
    addTile.addEventListener("click", () => addPhoto(c.id));
    strip.appendChild(addTile);

    li.append(head, strip);
    list.appendChild(li);
  });
}

function button(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

async function setCurrent(id) {
  try { await api("POST", "/api/current", { id }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function showPhoto(id, photo) {
  try { await api("POST", "/api/current", { id, photo }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function move(id, order) {
  try { await api("PATCH", "/api/cards/" + id, { order }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function rename(c) {
  const name = prompt("New name:", c.name);
  if (name === null) return;
  try { await api("PATCH", "/api/cards/" + c.id, { name }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function del(c) {
  if (!confirm('Delete "' + c.name + '"?')) return;
  try { await api("DELETE", "/api/cards/" + c.id); await refresh(); }
  catch (e) { toast(e.message); }
}
async function delPhoto(id, photoId) {
  try { await api("DELETE", "/api/cards/" + id + "/photos/" + photoId); await refresh(); }
  catch (e) { toast(e.message); }
}

// A hidden, reusable file input drives "add photo" for any card.
const photoPicker = document.createElement("input");
photoPicker.type = "file";
photoPicker.accept = "image/*";
photoPicker.style.display = "none";
document.body.appendChild(photoPicker);
let photoTargetCard = "";

function addPhoto(cardId) {
  photoTargetCard = cardId;
  photoPicker.value = "";
  photoPicker.click();
}
photoPicker.addEventListener("change", async () => {
  const file = photoPicker.files[0];
  if (!file || !photoTargetCard) return;
  const fd = new FormData();
  fd.append("image", file);
  try {
    await api("POST", "/api/cards/" + photoTargetCard + "/photos", fd, true);
    await refresh();
  } catch (e) { toast(e.message); }
});

$("prevBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/prev"); await refresh(); } catch (e) { toast(e.message); }
});
$("nextBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/next"); await refresh(); } catch (e) { toast(e.message); }
});
$("prevPhotoBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/photo/prev"); await refresh(); } catch (e) { toast(e.message); }
});
$("nextPhotoBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/photo/next"); await refresh(); } catch (e) { toast(e.message); }
});

$("imageInput").addEventListener("change", () => {
  const f = $("imageInput").files[0];
  const p = $("preview");
  if (f) { p.src = URL.createObjectURL(f); p.style.display = "block"; }
  else { p.style.display = "none"; }
});

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("imageInput").files[0];
  const name = $("nameInput").value.trim();
  if (!file || !name) { toast("Pick an image and enter a name."); return; }

  const fd = new FormData();
  fd.append("image", file);
  fd.append("name", name);

  const btn = $("addBtn");
  btn.disabled = true; btn.textContent = "Uploading…";
  try {
    await api("POST", "/api/cards", fd, true);
    $("addForm").reset();
    $("preview").style.display = "none";
    await refresh();
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Add card";
  }
});

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
