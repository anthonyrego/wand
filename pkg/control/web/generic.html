<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Game settings</title>
<style>
  :root { --bg:#11131a; --panel:#1b1e29; --panel2:#232737; --fg:#e8eaf2; --muted:#8b91a6; --accent:#f0aa5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; }
  h1 { font-size:18px; letter-spacing:1px; margin:4px 0 16px; }
  .card { background:var(--panel); border-radius:14px; padding:16px; }
  .setting { margin-bottom:18px; }
  .setting .top { display:flex; justify-content:space-between; align-items:baseline; }
  .setting label { color:var(--fg); font-size:15px; }
  .setting .val { color:var(--accent); font-variant-numeric:tabular-nums; font-size:15px; }
  input[type=range] { width:100%; margin-top:8px; accent-color:var(--accent); height:28px; }
  .btn { width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent);
         color:#1b1e29; font-size:15px; font-weight:600; letter-spacing:1px; cursor:pointer; }
  .btn:active { filter:brightness(0.9); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<h1 id="title">SETTINGS</h1>
<div class="card" id="list"><div class="empty">Loading…</div></div>
<script>
const BASE = "/api/game";
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(BASE + path, opts);
  if (!res.ok) throw new Error(method + " " + path + " -> " + res.status);
  return res.json();
}
let timers = {};
function fmt(v) { return (Math.round(v * 100) / 100).toString(); }
function render(data) {
  document.getElementById("title").textContent = data.title || "SETTINGS";
  const list = document.getElementById("list");
  if (!data.settings || !data.settings.length) { list.innerHTML = "<div class='empty'>No settings.</div>"; return; }
  list.innerHTML = "";
  data.settings.forEach(s => {
    const wrap = document.createElement("div");
    wrap.className = "setting";
    if (s.type === "button") {
      const btn = document.createElement("button");
      btn.className = "btn";
      btn.textContent = s.label;
      btn.addEventListener("click", () => {
        api("POST", "/settings", { key: s.key, value: 1 }).catch(() => {});
      });
      wrap.appendChild(btn);
      list.appendChild(wrap);
      return;
    }
    const step = (s.max - s.min) / 200 || 0.01;
    wrap.innerHTML =
      "<div class='top'><label>" + s.label + "</label><span class='val' id='v-" + s.key + "'>" + fmt(s.value) + "</span></div>" +
      "<input type='range' min='" + s.min + "' max='" + s.max + "' step='" + step + "' value='" + s.value + "' data-key='" + s.key + "'>";
    const input = wrap.querySelector("input");
    input.addEventListener("input", () => {
      document.getElementById("v-" + s.key).textContent = fmt(parseFloat(input.value));
      clearTimeout(timers[s.key]);
      timers[s.key] = setTimeout(() => {
        api("POST", "/settings", { key: s.key, value: parseFloat(input.value) }).catch(() => {});
      }, 120); // debounce live drags
    });
    list.appendChild(wrap);
  });
}
api("GET", "/settings").then(render).catch(() => {
  document.getElementById("list").innerHTML = "<div class='empty'>No settings for this game.</div>";
});
</script>
</body>
</html>
