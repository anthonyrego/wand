<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toy Box Flashcards</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #211e30;
    --panel2: #2c2840;
    --accent: #c8823c;
    --accent2: #6a32c8;
    --text: #ece8f5;
    --muted: #9690ad;
    --danger: #c84646;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  .nav { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .nav .navrow { display: flex; gap: 10px; align-items: center; }
  .nav .navrow button { flex: 1; }
  .nav .navlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; width: 56px; flex: none; }
  .nav .count { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  button {
    font: inherit; font-weight: 600;
    color: var(--text); background: var(--panel2);
    border: none; border-radius: 10px;
    padding: 11px 14px; cursor: pointer;
    transition: filter .12s ease;
  }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); color: #1a1208; }
  button.ghost { background: transparent; border: 1px solid #443e5e; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid #5a2a2a; }
  button:disabled { opacity: .35; cursor: default; }

  .card-form {
    background: var(--panel); border-radius: 14px;
    padding: 14px; margin-bottom: 20px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card-form label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  input[type=text] {
    font: inherit; color: var(--text);
    background: var(--panel2); border: 1px solid #3b3654;
    border-radius: 10px; padding: 11px 12px; width: 100%;
  }
  input[type=file] { font-size: 14px; color: var(--muted); }
  .preview { display: none; border-radius: 10px; max-height: 160px; object-fit: contain; background:#000; }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  li {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--panel); border-radius: 14px; padding: 12px;
    border: 2px solid transparent;
  }
  li.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cardhead { display: flex; align-items: flex-start; gap: 12px; }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-weight: 600; font-size: 16px; word-break: break-word; }
  .badge { display: inline-block; font-size: 11px; color: var(--accent); margin-top: 2px; }
  .actions { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .actions .row { display: flex; gap: 6px; }
  .actions button { padding: 8px 10px; font-size: 13px; }
  .reorder button { padding: 8px 11px; }

  /* Horizontal strip of a card's photos. */
  .photos { display: flex; gap: 8px; overflow-x: auto; padding: 2px; -webkit-overflow-scrolling: touch; }
  .photo { position: relative; flex: none; }
  .photo .thumb {
    width: 72px; height: 72px; display: block;
    border-radius: 10px; object-fit: cover; background: #000;
    border: 2px solid transparent; cursor: pointer;
  }
  .photo.active .thumb { border-color: var(--accent); }
  .photo .del {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; padding: 0; line-height: 1;
    border-radius: 50%; font-size: 13px; font-weight: 700;
    background: var(--danger); color: #fff; border: 2px solid var(--panel);
  }
  .addphoto {
    width: 72px; height: 72px; flex: none;
    border-radius: 10px; border: 2px dashed #443e5e;
    background: transparent; color: var(--muted);
    font-size: 26px; line-height: 1; cursor: pointer;
  }

  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  .toast.show { opacity: 1; }

  /* Crop modal: shown after picking a photo so a parent can frame the subject. */
  .cropback {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(8,6,14,.88);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .cropback.show { display: flex; }
  .cropmodal {
    background: var(--panel); border-radius: 14px; padding: 14px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 100%; max-height: 100%;
  }
  .crophint { font-size: 13px; color: var(--muted); text-align: center; }
  .cropstage {
    position: relative; margin: 0 auto; line-height: 0;
    background: #000; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .cropstage img { display: block; pointer-events: none; }
  .cropsel {
    position: absolute; box-sizing: border-box;
    border: 2px solid var(--accent); cursor: move;
  }
  .crophandle {
    position: absolute; width: 28px; height: 28px;
    background: var(--accent); border: 2px solid #1a1208; border-radius: 50%;
    touch-action: none;
  }
  .crophandle.nw { left: -14px; top: -14px; cursor: nwse-resize; }
  .crophandle.ne { right: -14px; top: -14px; cursor: nesw-resize; }
  .crophandle.sw { left: -14px; bottom: -14px; cursor: nesw-resize; }
  .crophandle.se { right: -14px; bottom: -14px; cursor: nwse-resize; }
  .cropbtns { display: flex; gap: 10px; }
  .cropbtns button { flex: 1; }
</style>
</head>
<body>
<main>
  <div class="nav">
    <div class="navrow">
      <span class="navlabel">Card</span>
      <button class="ghost" id="prevBtn">◀ Prev</button>
      <button class="ghost" id="nextBtn">Next ▶</button>
    </div>
    <div class="navrow">
      <span class="navlabel">Photo</span>
      <button class="ghost" id="prevPhotoBtn">◀</button>
      <span class="count" id="photoCount">– / –</span>
      <button class="ghost" id="nextPhotoBtn">▶</button>
    </div>
  </div>

  <form class="card-form" id="addForm">
    <label>New card image</label>
    <input type="file" id="imageInput" accept="image/*" required>
    <img class="preview" id="preview" alt="">
    <label>Name</label>
    <input type="text" id="nameInput" placeholder="e.g. APPLE" maxlength="40" required>
    <button class="primary" type="submit" id="addBtn">Add card</button>
  </form>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No cards yet — add one above. ⬆️</div>
</main>

<div class="toast" id="toast"></div>

<div class="cropback" id="cropback">
  <div class="cropmodal">
    <div class="crophint">Drag the corners to crop, or just tap Use photo.</div>
    <div class="cropstage" id="cropstage">
      <img id="cropimg" alt="">
      <div class="cropsel" id="cropsel">
        <div class="crophandle nw" data-h="nw"></div>
        <div class="crophandle ne" data-h="ne"></div>
        <div class="crophandle sw" data-h="sw"></div>
        <div class="crophandle se" data-h="se"></div>
      </div>
    </div>
    <div class="cropbtns">
      <button class="ghost" id="cropCancel">Cancel</button>
      <button class="primary" id="cropOk">Use photo</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let cards = [];
let currentId = "";
let currentPhoto = 0;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

// All REST lives under the control server's active-game prefix.
const BASE = "/api/game";

async function api(method, path, body, isForm) {
  const opts = { method };
  if (isForm) opts.body = body;
  else if (body !== undefined) {
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(BASE + path, opts);
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(text || (method + " " + path + " failed"));
  }
  return res.status === 204 ? null : res.json();
}

async function refresh() {
  try {
    const data = await api("GET", "/api/cards");
    cards = data.cards;
    currentId = data.currentId;
    currentPhoto = data.currentPhoto;
    render();
  } catch (e) { /* keep last view on transient errors */ }
}

function currentCard() {
  return cards.find((c) => c.id === currentId);
}

function imgURL(cardId, photoId) {
  return BASE + "/api/cards/" + cardId + "/photos/" + photoId + "/image";
}

function render() {
  const list = $("list");
  $("empty").hidden = cards.length > 0;
  list.innerHTML = "";

  // Photo navigation reflects the current card's set.
  const cur = currentCard();
  const n = cur ? cur.photos.length : 0;
  $("photoCount").textContent = n > 0 ? (currentPhoto + 1) + " / " + n : "– / –";
  const single = n <= 1;
  $("prevPhotoBtn").disabled = single;
  $("nextPhotoBtn").disabled = single;

  cards.forEach((c, i) => {
    const li = document.createElement("li");
    if (c.isCurrent) li.classList.add("current");

    // Header: name + badge, then card-level actions.
    const head = document.createElement("div");
    head.className = "cardhead";

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = c.name;
    meta.appendChild(name);
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = (c.isCurrent ? "● ON SCREEN · " : "") +
      c.photos.length + (c.photos.length === 1 ? " photo" : " photos");
    meta.appendChild(badge);

    const actions = document.createElement("div");
    actions.className = "actions";
    const row1 = document.createElement("div");
    row1.className = "row";
    const showBtn = button(c.isCurrent ? "Showing" : "Show", "primary", () => setCurrent(c.id));
    showBtn.disabled = c.isCurrent;
    const renameBtn = button("Rename", "ghost", () => rename(c));
    row1.append(showBtn, renameBtn);
    const row2 = document.createElement("div");
    row2.className = "row reorder";
    const upBtn = button("▲", "ghost", () => move(c.id, i - 1));
    upBtn.disabled = i === 0;
    const downBtn = button("▼", "ghost", () => move(c.id, i + 1));
    downBtn.disabled = i === cards.length - 1;
    const delBtn = button("Delete", "danger", () => del(c));
    row2.append(upBtn, downBtn, delBtn);
    actions.append(row1, row2);

    head.append(meta, actions);

    // Photo strip: every photo, plus an add tile. Tapping a photo shows it.
    const strip = document.createElement("div");
    strip.className = "photos";
    c.photos.forEach((p, pi) => {
      const cell = document.createElement("div");
      cell.className = "photo";
      if (c.isCurrent && pi === currentPhoto) cell.classList.add("active");

      const img = document.createElement("img");
      img.className = "thumb";
      img.src = imgURL(c.id, p.id);
      img.alt = c.name;
      img.addEventListener("click", () => showPhoto(c.id, pi));
      cell.appendChild(img);

      if (c.photos.length > 1) {
        const x = document.createElement("button");
        x.className = "del";
        x.textContent = "×";
        x.title = "Remove photo";
        x.addEventListener("click", (e) => { e.stopPropagation(); delPhoto(c.id, p.id); });
        cell.appendChild(x);
      }
      strip.appendChild(cell);
    });
    const addTile = document.createElement("button");
    addTile.className = "addphoto";
    addTile.textContent = "＋";
    addTile.title = "Add photo";
    addTile.addEventListener("click", () => addPhoto(c.id));
    strip.appendChild(addTile);

    li.append(head, strip);
    list.appendChild(li);
  });
}

function button(label, cls, onClick) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

async function setCurrent(id) {
  try { await api("POST", "/api/current", { id }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function showPhoto(id, photo) {
  try { await api("POST", "/api/current", { id, photo }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function move(id, order) {
  try { await api("PATCH", "/api/cards/" + id, { order }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function rename(c) {
  const name = prompt("New name:", c.name);
  if (name === null) return;
  try { await api("PATCH", "/api/cards/" + c.id, { name }); await refresh(); }
  catch (e) { toast(e.message); }
}
async function del(c) {
  if (!confirm('Delete "' + c.name + '"?')) return;
  try { await api("DELETE", "/api/cards/" + c.id); await refresh(); }
  catch (e) { toast(e.message); }
}
async function delPhoto(id, photoId) {
  try { await api("DELETE", "/api/cards/" + id + "/photos/" + photoId); await refresh(); }
  catch (e) { toast(e.message); }
}

// cropImage shows the crop modal for a picked File and resolves to a cropped
// JPEG Blob (or null if cancelled). The crop box is tracked in display pixels
// over a scaled <img>; on confirm we map back to natural pixels and draw the
// region to a canvas. Output is capped at the server's max dimension so uploads
// stay small, and the browser bakes in EXIF orientation, so the saved pixels
// already face the right way (the server then sees no orientation to apply).
const CROP_MAX = 1024, CROP_MIN = 24;
function cropImage(file) {
  return new Promise((resolve) => {
    const back = $("cropback"), stage = $("cropstage"), img = $("cropimg"), sel = $("cropsel");
    const url = URL.createObjectURL(file);
    let crop = { x: 0, y: 0, w: 0, h: 0 }; // display px, relative to stage
    let scale = 1;                          // display px per natural px
    let drag = null;

    function place() {
      sel.style.left = crop.x + "px"; sel.style.top = crop.y + "px";
      sel.style.width = crop.w + "px"; sel.style.height = crop.h + "px";
    }
    function point(e) {
      const r = stage.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function onDown(e) {
      drag = { h: e.target.dataset.h || "", start: point(e), orig: { ...crop } };
      e.preventDefault();
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    }
    function onMove(e) {
      if (!drag) return;
      const p = point(e), W = stage.clientWidth, H = stage.clientHeight;
      if (!drag.h) { // move the whole box
        crop.x = Math.max(0, Math.min(drag.orig.x + (p.x - drag.start.x), W - crop.w));
        crop.y = Math.max(0, Math.min(drag.orig.y + (p.y - drag.start.y), H - crop.h));
      } else {       // drag one corner; opposite corner stays put
        let l = crop.x, t = crop.y, r = crop.x + crop.w, b = crop.y + crop.h;
        const px = Math.max(0, Math.min(p.x, W)), py = Math.max(0, Math.min(p.y, H));
        if (drag.h.includes("w")) l = Math.min(px, r - CROP_MIN);
        if (drag.h.includes("e")) r = Math.max(px, l + CROP_MIN);
        if (drag.h.includes("n")) t = Math.min(py, b - CROP_MIN);
        if (drag.h.includes("s")) b = Math.max(py, t + CROP_MIN);
        crop = { x: l, y: t, w: r - l, h: b - t };
      }
      place();
    }
    function onUp() {
      drag = null;
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    }
    function cleanup() {
      back.classList.remove("show");
      sel.removeEventListener("pointerdown", onDown);
      $("cropOk").removeEventListener("click", onOk);
      $("cropCancel").removeEventListener("click", onCancel);
      back.removeEventListener("pointerdown", onBackdrop);
      window.removeEventListener("keydown", onKey);
      onUp();
      img.onload = img.onerror = null;
      URL.revokeObjectURL(url);
    }
    function onCancel() { cleanup(); resolve(null); }
    function onBackdrop(e) { if (e.target === back) onCancel(); }
    function onKey(e) { if (e.key === "Escape") onCancel(); }
    function onOk() {
      let sx = Math.round(crop.x / scale), sy = Math.round(crop.y / scale);
      let sw = Math.max(1, Math.round(crop.w / scale)), sh = Math.max(1, Math.round(crop.h / scale));
      sx = Math.min(sx, img.naturalWidth - 1); sy = Math.min(sy, img.naturalHeight - 1);
      sw = Math.min(sw, img.naturalWidth - sx); sh = Math.min(sh, img.naturalHeight - sy);
      const k = Math.min(1, CROP_MAX / Math.max(sw, sh));
      const ow = Math.max(1, Math.round(sw * k)), oh = Math.max(1, Math.round(sh * k));
      const canvas = document.createElement("canvas");
      canvas.width = ow; canvas.height = oh;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, ow, oh);
      cleanup();
      canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.9);
    }
    img.onerror = () => { cleanup(); toast("Could not read that image."); resolve(null); };
    img.onload = () => {
      const maxW = Math.min(window.innerWidth - 60, 560), maxH = window.innerHeight * 0.6;
      scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
      const dw = Math.round(img.naturalWidth * scale), dh = Math.round(img.naturalHeight * scale);
      img.style.width = stage.style.width = dw + "px";
      img.style.height = stage.style.height = dh + "px";
      crop = { x: 0, y: 0, w: dw, h: dh };
      place();
      sel.addEventListener("pointerdown", onDown);
      $("cropOk").addEventListener("click", onOk);
      $("cropCancel").addEventListener("click", onCancel);
      back.addEventListener("pointerdown", onBackdrop);
      window.addEventListener("keydown", onKey);
      back.classList.add("show");
    };
    img.src = url;
  });
}

// A hidden, reusable file input drives "add photo" for any card.
const photoPicker = document.createElement("input");
photoPicker.type = "file";
photoPicker.accept = "image/*";
photoPicker.style.display = "none";
document.body.appendChild(photoPicker);
let photoTargetCard = "";

function addPhoto(cardId) {
  photoTargetCard = cardId;
  photoPicker.value = "";
  photoPicker.click();
}
photoPicker.addEventListener("change", async () => {
  const file = photoPicker.files[0];
  if (!file || !photoTargetCard) return;
  const blob = await cropImage(file);
  if (!blob) return;
  const fd = new FormData();
  fd.append("image", blob, "photo.jpg");
  try {
    await api("POST", "/api/cards/" + photoTargetCard + "/photos", fd, true);
    await refresh();
  } catch (e) { toast(e.message); }
});

$("prevBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/prev"); await refresh(); } catch (e) { toast(e.message); }
});
$("nextBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/next"); await refresh(); } catch (e) { toast(e.message); }
});
$("prevPhotoBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/photo/prev"); await refresh(); } catch (e) { toast(e.message); }
});
$("nextPhotoBtn").addEventListener("click", async () => {
  try { await api("POST", "/api/photo/next"); await refresh(); } catch (e) { toast(e.message); }
});

$("imageInput").addEventListener("change", () => {
  const f = $("imageInput").files[0];
  const p = $("preview");
  if (f) { p.src = URL.createObjectURL(f); p.style.display = "block"; }
  else { p.style.display = "none"; }
});

$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("imageInput").files[0];
  const name = $("nameInput").value.trim();
  if (!file || !name) { toast("Pick an image and enter a name."); return; }

  const blob = await cropImage(file);
  if (!blob) return; // cancelled the crop

  const fd = new FormData();
  fd.append("image", blob, "card.jpg");
  fd.append("name", name);

  const btn = $("addBtn");
  btn.disabled = true; btn.textContent = "Uploading…";
  try {
    await api("POST", "/api/cards", fd, true);
    $("addForm").reset();
    $("preview").style.display = "none";
    await refresh();
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Add card";
  }
});

refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
