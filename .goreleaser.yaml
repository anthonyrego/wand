# GoReleaser config — builds the Toy Box host app for every desktop/Pi target
# and publishes a GitHub Release on each `v*` tag. The app uses go-sdl3 (purego,
# no cgo) with SDL3 embedded via binsdl, so a single Linux runner cross-compiles
# every target with no SDL toolchain. See .github/workflows/release.yml.
version: 2

project_name: toybox

before:
  hooks:
    - go mod tidy

builds:
  - id: toybox
    main: ./cmd/play
    binary: toybox
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    # All 6 combinations build (pure Go). macOS, Windows, and Linux/amd64 embed
    # SDL3 via binsdl and are fully self-contained; Linux/arm64 (Raspberry Pi)
    # needs system SDL3 at runtime — see the release footer below.
    # NOTE: macOS binaries must be built on a macOS runner (see release.yml) so
    # the Mach-O is well-formed (a Linux-cross-built darwin binary crashes under
    # Rosetta) and so codesigning/notarization can run.

# Fuse the two macOS slices into one universal binary — a single Mac download
# that runs on both Intel and Apple Silicon, with no arch for the user to pick.
universal_binaries:
  - id: toybox-universal
    ids:
      - toybox
    replace: true
    name_template: "toybox"
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: toybox
    ids:
      - toybox
      - toybox-universal
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: anthonyrego
    name: toybox
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Download the archive for your computer, extract it, and run `toybox`.

    - **macOS** — one universal build (Intel + Apple Silicon), signed & notarized by Apple: just open it.
    - **Windows** and **Linux (amd64)** bundle SDL3 — nothing else to install.
    - **Linux (arm64 / Raspberry Pi)** needs system SDL3 at runtime:
      `sudo apt install libsdl3-0` (or your distro's equivalent).

# Sign (Developer ID) + notarize the macOS universal binary so Gatekeeper lets
# it run with no warning. Gated on isEnvSet so local `make release-snapshot`
# (no secrets) still works. Requires building on a macOS runner — see release.yml.
# Secrets, set in the repo: MACOS_SIGN_P12 (base64 .p12), MACOS_SIGN_PASSWORD,
# MACOS_NOTARY_ISSUER_ID, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_KEY (base64 .p8).
# See docs/RELEASING.md.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      # universal_binaries (replace:true) swaps the per-arch darwin builds for
      # this id, so notarize must target it — otherwise it finds no darwin
      # binaries and silently skips.
      ids:
        - toybox-universal
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        # binsdl dlopen()s an embedded SDL3 dylib; the hardened runtime's Library
        # Validation would block it (different Team ID) without this entitlement.
        entitlements: ./entitlements.plist
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m
