name: release

# Cuts a GitHub Release with prebuilt binaries whenever a v* tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# No SDL toolchain needed — the app is pure Go (purego) with SDL3 embedded.
# Runs on macOS so the darwin binaries are well-formed Mach-O and can be signed
# + notarized — a Linux-cross-built darwin binary crashes under Rosetta. macOS
# still cross-compiles the Linux/Windows targets (pure Go). The signing/notary
# secrets below are documented in docs/RELEASING.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + Apple Notary API (see docs/RELEASING.md).
          # If these secrets are unset, the notarize step auto-skips and macOS
          # binaries ship unsigned (they'll hit Gatekeeper).
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Wrap the universal binary in a double-clickable, signed+notarized+stapled
      # Toy Box.app inside a .dmg, and attach it to the release. No-ops without
      # the signing secrets. See scripts/package-macos.sh.
      - name: Package & notarize macOS .app + .dmg
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
